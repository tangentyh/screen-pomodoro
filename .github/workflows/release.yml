name: Release

# Ship with: git tag vX.Y.Z && git push origin vX.Y.Z
# Exception: v0.1.0 itself is published by hand (`npm login && npm publish`)
# because npm only lets you attach a trusted publisher to a package that
# already exists. After that one-time publish, add this repo + workflow
# under npmjs.com > package Settings > Trusted Publishers and every later
# release is fully automated from the tag (verify, npm publish, Release).
# NOTE: no v0.1.0 tag push — that version is already on the registry, so
# the workflow's publish step would (correctly) fail.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Publish to npm and GitHub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Node 24 bundles npm 11, required for OIDC trusted publishing.
          node-version: 24
          cache: npm
          # No NODE_AUTH_TOKEN on purpose: auth comes from npm trusted
          # publishing (OIDC) — configure it once on npmjs.com under the
          # package's Trusted Publishers. A token here (even an empty one
          # from a missing secret) takes precedence and breaks the OIDC flow.
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Check tag matches package version
        run: |
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "v${pkg_version}" != "${{ github.ref_name }}" ]; then
            echo "tag ${{ github.ref_name }} does not match package.json version v${pkg_version}"
            exit 1
          fi
      - run: npm run verify
      - run: npm publish --provenance --access public
      - name: Create GitHub Release
        run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
